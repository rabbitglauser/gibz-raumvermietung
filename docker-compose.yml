services:
  mongodb:
    image: mongo:8
    container_name: room-rental-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: room_rental
    volumes:
      - mongodb_data:/data/db
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/seeds:/seeds:ro

  backend:
    build:
      context: ./backend
    container_name: room-rental-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - mongodb

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: room-rental-frontend
    environment:
      API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Optional: captures reminder emails for the demo. Set SMTP_HOST=mailhog and
  # REMINDERS_ENABLED=true in backend/.env, then open http://localhost:8025.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: room-rental-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mongodb_data:
