# .github/labeler.yml

backend:
  - changed-files:
      - any-glob-to-any-file:
          - 'backend/**'

frontend:
  - changed-files:
      - any-glob-to-any-file:
          - 'frontend/**'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '**/*.md'

authentication:
  - changed-files:
      - any-glob-to-any-file:
          - 'backend/**/auth/**'
          - 'frontend/**/auth/**'

database design:
  - changed-files:
      - any-glob-to-any-file:
          - 'backend/**/db/**'
          - 'backend/**/models/**'
          - 'backend/**/schemas/**'

ci/cd:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - 'docker-compose*.yml'
          - 'Dockerfile*'
