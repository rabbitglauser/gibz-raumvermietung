name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  size-label:
    name: Add Size Label
    runs-on: ubuntu-latest
    steps:
      - name: Calculate PR size and add label
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const additions = pr.additions || 0;
            const deletions = pr.deletions || 0;
            const totalChanges = additions + deletions;
            
            let sizeLabel;
            if (totalChanges <= 10) {
              sizeLabel = 'size:XS';
            } else if (totalChanges <= 50) {
              sizeLabel = 'size:S';
            } else if (totalChanges <= 200) {
              sizeLabel = 'size:M';
            } else if (totalChanges <= 500) {
              sizeLabel = 'size:L';
            } else {
              sizeLabel = 'size:XL';
            }
            
            // Remove existing size labels
            const existingLabels = pr.labels.map(l => l.name);
            const sizeLabels = ['size:XS', 'size:S', 'size:M', 'size:L', 'size:XL'];
            for (const label of sizeLabels) {
              if (existingLabels.includes(label) && label !== sizeLabel) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: label
                }).catch(() => {});
              }
            }
            
            // Add new size label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: [sizeLabel]
            });
            
            console.log('Added label: ' + sizeLabel + ' (' + totalChanges + ' lines changed)');

  area-label:
    name: Add Area Labels
    runs-on: ubuntu-latest
    steps:
      - name: Get changed files and add labels
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            
            // Get list of changed files
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });
            
            const changedFiles = files.map(f => f.filename);
            console.log('Changed files:', changedFiles);
            
            const labelsToAdd = new Set();
            
            // Area mapping — matches the gibz-raumvermietung layout
            const areaPatterns = [
              { pattern: /^backend\/app\/routers\//, label: 'area:reservations' },
              { pattern: /^backend\/tests\//, label: 'area:tests' },
              { pattern: /^frontend\/src\/components\//, label: 'area:ui' },
              { pattern: /^frontend\/src\/app\//, label: 'area:pages' },
              { pattern: /^database\//, label: 'area:database' },
              { pattern: /^docs\//, label: 'documentation' },
              { pattern: /^\.github\//, label: 'infrastructure' },
              { pattern: /^docker-compose.*\.ya?ml$|^Dockerfile/, label: 'infrastructure' },
            ];

            // Layer mapping
            const layerPatterns = [
              { pattern: /^backend\//, label: 'backend' },
              { pattern: /^frontend\//, label: 'frontend' },
            ];
            
            for (const file of changedFiles) {
              for (const {pattern, label} of areaPatterns) {
                if (pattern.test(file)) {
                  labelsToAdd.add(label);
                }
              }
              for (const {pattern, label} of layerPatterns) {
                if (pattern.test(file)) {
                  labelsToAdd.add(label);
                }
              }
            }
            
            if (labelsToAdd.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: Array.from(labelsToAdd)
              });
              console.log('Added labels:', Array.from(labelsToAdd));
            }
