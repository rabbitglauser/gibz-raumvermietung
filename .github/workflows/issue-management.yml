name: Issue Management

on:
  issues:
    types: [opened, edited, labeled]

# --------------------------------------------------------------------------
# GitHub Project V2 node IDs — REPLACE the REPLACE_ME_* values below with the
# real IDs from your own Project (see docs/github-setup.md). Without these,
# every GraphQL call here will fail and the workflow is a no-op.
# --------------------------------------------------------------------------
env:
  PROJECT_ID: 'REPLACE_ME_PROJECT_ID'
  STATUS_FIELD_ID: 'REPLACE_ME_STATUS_FIELD_ID'
  PRIORITY_FIELD_ID: 'REPLACE_ME_PRIORITY_FIELD_ID'
  STATUS_BACKLOG: 'REPLACE_ME_STATUS_BACKLOG'
  STATUS_TODO: 'REPLACE_ME_STATUS_TODO'
  STATUS_IN_PROGRESS: 'REPLACE_ME_STATUS_IN_PROGRESS'
  STATUS_TESTING: 'REPLACE_ME_STATUS_TESTING'
  STATUS_DONE: 'REPLACE_ME_STATUS_DONE'
  PRIORITY_P0: 'REPLACE_ME_PRIORITY_P0'
  PRIORITY_P1: 'REPLACE_ME_PRIORITY_P1'
  PRIORITY_P2: 'REPLACE_ME_PRIORITY_P2'

jobs:
  add-to-project:
    name: Add to Project Board
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    outputs:
      item_id: ${{ steps.add.outputs.item_id }}
    steps:
      - name: Add issue to project
        id: add
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const mutation = `
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                  item { id }
                }
              }
            `;
            
            const projectId = '${{ env.PROJECT_ID }}';
            const contentId = context.payload.issue.node_id;
            
            try {
              const result = await github.graphql(mutation, {
                projectId: projectId,
                contentId: contentId
              });
              const itemId = result.addProjectV2ItemById.item.id;
              console.log('Added issue #' + context.payload.issue.number + ' to project');
              console.log('Item ID:', itemId);
              core.setOutput('item_id', itemId);
            } catch (error) {
              console.error('Failed to add to project:', error.message);
              throw error;
            }

  review-issue:
    name: AI Review & Label Issue
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    needs: add-to-project
    permissions:
      issues: write
    steps:
      - name: AI Review and Auto-Label
        uses: actions/github-script@v9
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const title = issue.title || '';
            const body = issue.body || '';
            const existingLabels = issue.labels.map(l => l.name);
            
            const apiKey = process.env.OPENAI_API_KEY;
            if (!apiKey) {
              console.log('OPENAI_API_KEY not set, skipping AI review');
              return;
            }
            
            const prompt = `You are an AI assistant for Butel, a Swiss restaurant ordering platform with WhatsApp integration. Analyze this GitHub issue and respond with ONLY valid JSON.

            **Issue Title:** ${title}
            **Issue Description:** ${body || '(empty)'}

            Butel has these components:
            - whatsapp: WhatsApp bot, messaging, Meta API integration
            - payments: Payment processing (Payrexx), TWINT, cards
            - kitchen: Kitchen display iPad app, order workflow, real-time updates
            - ordering: Customer ordering webapp (menu, cart, checkout)
            - admin: Admin dashboard for restaurant management
            - auth: Authentication, 2FA, JWT, security
            - menu: Menu management, categories, items, options
            - analytics: Conversion tracking, metrics, reporting
            - feedback: Post-order customer feedback and ratings
            - mdm: iPad MDM device management, enrollment, commands
            - refunds: Refund processing, chargebacks
            - infrastructure: DevOps, CI/CD, Docker, servers, monitoring

            Layer keywords:
            - frontend: React, Vite, UI, CSS, components, pages
            - backend: NestJS, API, database, Prisma, services
            - mobile: iOS, iPad, Swift, native app

            Respond with this JSON:
            {
              "area": "whatsapp" | "payments" | "kitchen" | "ordering" | "admin" | "auth" | "menu" | "analytics" | "feedback" | "mdm" | "refunds" | "infrastructure" | null,
              "type": "feature" | "bug" | "improvement" | "refactor" | "docs" | null,
              "priority": "critical" | "high" | "medium" | "low" | null,
              "layer": "frontend" | "backend" | "mobile" | null,
              "version": "V2" | "V3" | null,
              "needsMoreInfo": true | false,
              "review": "Brief feedback (max 50 words) or 'Looks good!'"
            }

            Guidelines:
            - area: Pick the PRIMARY component affected
            - type: bug=broken/error, feature=new capability, improvement=enhance existing
            - priority: critical=security/data loss, high=important, medium=normal, low=nice-to-have
            - needsMoreInfo: true if title is vague AND body is empty/minimal`;

            try {
              const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': 'Bearer ' + apiKey
                },
                body: JSON.stringify({
                  model: 'gpt-4o-mini',
                  messages: [{ role: 'user', content: prompt }],
                  max_tokens: 500,
                  temperature: 0.1
                })
              });
              
              if (!response.ok) {
                throw new Error('OpenAI API error: ' + response.status);
              }
              
              const data = await response.json();
              let aiResponse = data.choices[0].message.content.trim();
              
              const jsonMatch = aiResponse.match(/\{[\s\S]*\}/);
              if (!jsonMatch) {
                throw new Error('No JSON in AI response');
              }
              
              const analysis = JSON.parse(jsonMatch[0]);
              console.log('AI Analysis:', JSON.stringify(analysis, null, 2));
              
              const labelsToAdd = [];
              
              const validAreas = ['whatsapp', 'payments', 'kitchen', 'ordering', 'admin', 'auth', 'menu', 'analytics', 'feedback', 'mdm', 'refunds', 'infrastructure'];
              const validTypes = ['feature', 'bug', 'improvement', 'refactor', 'docs'];
              const validPriorities = ['critical', 'high', 'medium', 'low'];
              const validLayers = ['frontend', 'backend', 'mobile'];
              const validVersions = ['V2', 'V3'];
              
              if (analysis.area && validAreas.includes(analysis.area)) {
                if (analysis.area === 'infrastructure') {
                  labelsToAdd.push('infrastructure');
                } else {
                  labelsToAdd.push('area:' + analysis.area);
                }
              }
              if (analysis.type && validTypes.includes(analysis.type)) {
                labelsToAdd.push('type:' + analysis.type);
              }
              if (analysis.priority && validPriorities.includes(analysis.priority)) {
                labelsToAdd.push('priority:' + analysis.priority);
              }
              if (analysis.layer && validLayers.includes(analysis.layer)) {
                labelsToAdd.push(analysis.layer);
              }
              if (analysis.version && validVersions.includes(analysis.version)) {
                labelsToAdd.push(analysis.version);
              }
              if (analysis.needsMoreInfo === true) {
                labelsToAdd.push('needs-description');
              }
              
              const newLabels = labelsToAdd.filter(l => !existingLabels.includes(l));
              
              if (newLabels.length > 0) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: newLabels
                });
                console.log('Added labels: ' + newLabels.join(', '));
              }
              
              // Auto-assign
              try {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  assignees: ['Nepomuk5665']
                });
                console.log('Assigned to Nepomuk5665');
              } catch (e) {
                console.log('Could not assign:', e.message);
              }
              
              // Sync priority to project field
              const itemId = '${{ needs.add-to-project.outputs.item_id }}';
              if (itemId && analysis.priority) {
                const priorityMap = {
                  'critical': '${{ env.PRIORITY_P0 }}',
                  'high': '${{ env.PRIORITY_P1 }}',
                  'medium': '${{ env.PRIORITY_P2 }}',
                  'low': '${{ env.PRIORITY_P2 }}'
                };
                
                const priorityOptionId = priorityMap[analysis.priority];
                if (priorityOptionId) {
                  try {
                    const mutation = `
                      mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: String!) {
                        updateProjectV2ItemFieldValue(input: {
                          projectId: $projectId
                          itemId: $itemId
                          fieldId: $fieldId
                          value: { singleSelectOptionId: $value }
                        }) {
                          projectV2Item { id }
                        }
                      }
                    `;
                    await github.graphql(mutation, {
                      projectId: '${{ env.PROJECT_ID }}',
                      itemId: itemId,
                      fieldId: '${{ env.PRIORITY_FIELD_ID }}',
                      value: priorityOptionId
                    });
                    console.log('Set project priority to ' + analysis.priority);
                  } catch (e) {
                    console.log('Could not set project priority:', e.message);
                  }
                }
              }
              
              // Add review comment only if needed
              const review = analysis.review || '';
              const needsComment = review && 
                !review.toLowerCase().includes('looks good') &&
                (analysis.needsMoreInfo || review.length > 20);
              
              if (needsComment) {
                const labelList = newLabels.length > 0 
                  ? newLabels.map(l => '`' + l + '`').join(', ') 
                  : 'None';
                  
                const comment = '## AI Review\n\n' + review + '\n\n**Auto-applied labels:** ' + labelList + '\n\n---\n*Automated review*';
                
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: comment
                });
              }
              
              console.log('Issue #' + issue.number + ' processed successfully');
            } catch (error) {
              console.error('AI review failed:', error.message);
            }

  sync-priority-on-label:
    name: Sync Priority Label to Project
    runs-on: ubuntu-latest
    if: github.event.action == 'labeled' && startsWith(github.event.label.name, 'priority:')
    steps:
      - name: Update project priority field
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const label = context.payload.label.name;
            const issueNodeId = context.payload.issue.node_id;
            
            const priorityMap = {
              'priority:critical': '${{ env.PRIORITY_P0 }}',
              'priority:high': '${{ env.PRIORITY_P1 }}',
              'priority:medium': '${{ env.PRIORITY_P2 }}',
              'priority:low': '${{ env.PRIORITY_P2 }}'
            };
            
            const priorityOptionId = priorityMap[label];
            if (!priorityOptionId) {
              console.log('Unknown priority label: ' + label);
              return;
            }
            
            // Find the project item for this issue
            const query = `
              query($issueId: ID!) {
                node(id: $issueId) {
                  ... on Issue {
                    projectItems(first: 10) {
                      nodes {
                        id
                        project { id }
                      }
                    }
                  }
                }
              }
            `;
            
            try {
              const result = await github.graphql(query, { issueId: issueNodeId });
              const items = result.node.projectItems.nodes;
              const projectItem = items.find(i => i.project.id === '${{ env.PROJECT_ID }}');
              
              if (!projectItem) {
                console.log('Issue not found in project');
                return;
              }
              
              // Update the priority field
              const mutation = `
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $value }
                  }) {
                    projectV2Item { id }
                  }
                }
              `;
              
              await github.graphql(mutation, {
                projectId: '${{ env.PROJECT_ID }}',
                itemId: projectItem.id,
                fieldId: '${{ env.PRIORITY_FIELD_ID }}',
                value: priorityOptionId
              });
              
              console.log('Updated project priority for issue #' + context.payload.issue.number);
            } catch (error) {
              console.error('Failed to sync priority:', error.message);
            }
