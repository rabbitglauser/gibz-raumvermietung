name: AI Project Manager

on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review, converted_to_draft, closed, reopened]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  check_suite:
    types: [completed]
  issues:
    types: [opened, edited, closed, reopened]

# --------------------------------------------------------------------------
# GitHub Project V2 node IDs — REPLACE the REPLACE_ME_* values below with the
# real IDs from your own Project. To fetch them, see docs in `docs/github-setup.md`
# (or run: `gh api graphql -f query='{ ... }'` per GitHub Projects V2 docs).
# Until these are replaced the workflow's GraphQL calls will fail and the run
# will be a no-op.
# --------------------------------------------------------------------------
env:
  PROJECT_ID: 'REPLACE_ME_PROJECT_ID'
  STATUS_FIELD_ID: 'REPLACE_ME_STATUS_FIELD_ID'
  PRIORITY_FIELD_ID: 'REPLACE_ME_PRIORITY_FIELD_ID'
  SIZE_FIELD_ID: 'REPLACE_ME_SIZE_FIELD_ID'
  STATUS_BACKLOG: 'REPLACE_ME_STATUS_BACKLOG'
  STATUS_TODO: 'REPLACE_ME_STATUS_TODO'
  STATUS_IN_PROGRESS: 'REPLACE_ME_STATUS_IN_PROGRESS'
  STATUS_TESTING: 'REPLACE_ME_STATUS_TESTING'
  STATUS_DONE: 'REPLACE_ME_STATUS_DONE'
  PRIORITY_P0: 'REPLACE_ME_PRIORITY_P0'
  PRIORITY_P1: 'REPLACE_ME_PRIORITY_P1'
  PRIORITY_P2: 'REPLACE_ME_PRIORITY_P2'
  SIZE_XS: 'REPLACE_ME_SIZE_XS'
  SIZE_S: 'REPLACE_ME_SIZE_S'
  SIZE_M: 'REPLACE_ME_SIZE_M'
  SIZE_L: 'REPLACE_ME_SIZE_L'
  SIZE_XL: 'REPLACE_ME_SIZE_XL'

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

jobs:
  ai-manager:
    name: AI Project Manager
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'issue_comment' || !contains(github.event.comment.user.login, '[bot]'))
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: AI Project Manager
        uses: actions/github-script@v9
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const script = require('./.github/scripts/ai-project-manager.js');
            await script({ github, context, core });
